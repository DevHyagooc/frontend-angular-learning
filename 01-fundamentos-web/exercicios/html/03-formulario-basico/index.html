<!-- 
1. Qual é a diferença entre os atributos id e name de um input? R: id identifica o elemento e pode ser associado a um for, o name identifica o campo que está sendo enviado no formulário
2. O que acontece quando o atributo for de um label não corresponde ao id do campo? R: Eles não são associados
3. Qual é a diferença entre type="button" e type="submit"? R: o button ele é um botão que pode realizar qualquer outra função, já o submit tem como principal responsabilidade enviar os dados do formulário
4. Por que não podemos depender exclusivamente do atributo required para validar dados enviados a uma API? R: Pois não devemos depender do que o usuário está enviando, isso deve ser uma regra do back pra prevenir falhas e envios forçados
-->

<!DOCTYPE html>
<html lang="pt-br">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Solicitação de Suporte</title>
</head>

<body>
   <header>
      <h1>Formulário de Solicitação de Suporte</h1>
   </header>

   <main>
      <form>
         <label for="nome">Nome completo:</label>
         <input type="text" id="nome" name="nome" required>

         <label for="email">E-mail</label>
         <input type="email" id="email" name="email" required>

         <label for="assunto">Assunto da Solicitação</label>
         <input type="text" id="assunto" name="assunto">

         <button type="submit">Enviar</button>
      </form>
   </main>

</body>

</html>
